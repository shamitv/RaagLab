[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "museforge"
version = "0.1.0"
description = "Portable local music workspace foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.0.52",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.5",
]

[project.scripts]
museforge-artifact-gc = "museforge.maintenance:main"

[dependency-groups]
api = ["fastapi==0.141.1", "uvicorn==0.52.4"]
mock-worker = ["celery==5.6.3"]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/museforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires the isolated PostgreSQL/RabbitMQ Compose stack"]
